services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: resume_agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resume_agent"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/resume_agent
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    volumes:
      - uploads:/app/data/uploads
      - hf-cache:/root/.cache
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1024m
    expose:
      - "8000"

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - api
    mem_limit: 128m

volumes:
  pgdata:
  uploads:
  hf-cache:
